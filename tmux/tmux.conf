# sensible options
set -g mouse on
set -g set-clipboard on
set -s escape-time 0
set -g history-limit 100000
set -g allow-passthrough on

set -s extended-keys on
set -s focus-events on

# window numbering
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# prefix
set -g prefix C-Space
unbind C-b
bind C-Space send-prefix

# split panes
unbind %
bind | split-window -h -c "#{pane_current_path}"
unbind '"'
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# resize panes
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

# kill panes
bind x kill-pane
bind & kill-window

# zoom / maximize pane
bind -r m resize-pane -Z

# switch sessions
unbind Enter
bind Enter choose-session

# copy mode
# move character    | j k h l
# move line         | Ctrl+Y Ctrl+E
# move whole screen | Ctrl+B Ctrl+F
# search            | /
# start selection   | Space
# copy selection    | Enter
# clear selection   | Escape
# exit copy mode    | q
set -g mode-keys vi
set -g status-keys vi

bind v copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel

# stay in copy mode when dragging with mouse
unbind -T copy-mode-vi MouseDragEnd1Pane

# source config
unbind r
bind r source-file ~/.config/tmux/tmux.conf

# clear screen
# bind -n C-k send "clear && printf '\\e[3J'" \; send "\r"
bind -n C-l send C-l
bind -n C-k clearhist

# Theme
# status line
set -g status-style bg=default
set -g status-fg default
set -g status-left-length 20
set -g status-left "#S"
set -g status-right ""
set -g status-justify absolute-centre
set -g message-command-style bg=default,fg=blue
set -g message-style bg=default,fg=blue
set -g mode-style bg=default,fg=blue

# window
set -g window-status-current-format "#[fg=blue,bg=default]#I:#W"
set -g window-status-last-style fg=default,bg=default
set -g window-status-format "#[fg=default]#I:#W"

# pane-border
set -g pane-border-indicators off
set -g pane-border-style fg=black,bg=default
set -g pane-active-border-style fg=black,bg=default
