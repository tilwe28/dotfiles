# sensible options
set -g mouse on

# window numbering
set -g base-index 1
setw -g pane-base-index 1
set-option -g renumber-windows on
set-window-option -g pane-base-index 1

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# prefix
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

# split panes
unbind %
bind | split-window -h
unbind '"'
bind - split-window -v

# resize panes
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

# zoom / maximize pane
bind -r m resize-pane -Z

# status line
set -g status-bg '#1a212e'
set -g status-fg white
# set-option -g status-position top

# tpm
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# plugins
set -g @plugin 'christoomey/vim-tmux-navigator'
bind C-l send-keys 'C-l'    # prefix C-l to clear screen
set -g @plugin 'tmux-plugins/tmux-resurrect'    # keep sessions alive
set -g @plugin 'tmux-plugins/tmux-continuum'    # auto save sessions

# theme
set -g @plugin 'catppuccin/tmux'
# CATPPUCCIN #
# config 3
set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"

set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"

set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W"

set -g @catppuccin_status_modules_right "directory session"
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_right_separator_inverse "no"
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"

set -g @catppuccin_directory_text "#{pane_current_path}"

# custom
set -g @catppuccin_pane_border_style "fg=#3c3e44"
set -g @catppuccin_pane_active_border_style "fg=#3c3e44"
set -g status-bg "#1a212e"
# CATPPUCCIN #

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
